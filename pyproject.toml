[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cvproj-mri"
version = "0.1.0"
description = "Reproducible paired T1/T2 MRI reconstruction baseline"
requires-python = ">=3.11,<3.13"
dependencies = [
  "hydra-core==1.3.2",
  "nibabel>=5.3,<6",
  "numpy>=2,<3",
  "openneuro-py>=2026.9.1",
  "torch==2.9.1",
]

[project.optional-dependencies]
cpu = ["torch==2.9.1"]
cuda = ["torch==2.9.1"]

[dependency-groups]
dev = ["mypy>=1.15,<2", "pytest>=8,<9", "ruff>=0.11,<1"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu128", extra = "cuda" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/cvproj"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["nibabel.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
